name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Missing Android SDKs
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "platforms;android-36" >/dev/null || true


      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons
        env:
          GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseG1GC'"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk